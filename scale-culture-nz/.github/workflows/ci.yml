name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collector service tests
        run: npm test
        working-directory: collector-service
      - name: Purchase-limits Function tests
        run: node --test test/*.test.js
        working-directory: shopify-app/extensions/purchase-limits
      - name: Catalogue template passes the product data standard
        run: node scripts/validate-catalogue.mjs data/product-import-template.csv
      - name: Store setup dry run
        run: node scripts/setup-store.mjs --dry-run > /dev/null
      - name: Shopify theme check
        run: |
          npm install --no-save --prefix .ci @shopify/theme-check-node
          node scripts/theme-check.mjs
      - name: Preview renders
        run: npm install && node build.mjs
        working-directory: preview
