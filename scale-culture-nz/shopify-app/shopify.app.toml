# Shopify app config for Scale Culture NZ (Shopify CLI: `shopify app deploy`).
# One custom app carries the collector-service proxy/webhooks and the
# purchase-limits checkout Function. Replace the placeholders before deploying.

client_id = "REPLACE_WITH_CLIENT_ID"
name = "Scale Culture Collector"
application_url = "https://collector.scaleculture.co.nz"
embedded = false

[access_scopes]
scopes = "read_customers,write_customers,read_products,write_products,read_metaobjects,write_metaobjects,read_orders,read_inventory"

[auth]
redirect_urls = ["https://collector.scaleculture.co.nz/auth/callback"]

[app_proxy]
url = "https://collector.scaleculture.co.nz/proxy"
subpath = "collector"
prefix = "apps"

[webhooks]
api_version = "2025-07"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "orders/fulfilled", "orders/cancelled"]
  uri = "https://collector.scaleculture.co.nz/webhooks"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/redact", "customers/data_request", "shop/redact"]
  uri = "https://collector.scaleculture.co.nz/webhooks"

[pos]
embedded = false
