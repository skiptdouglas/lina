api_version = "2025-07"

[[extensions]]
name = "Drop purchase limits"
handle = "purchase-limits"
type = "function"
description = "Blocks checkout when a customer exceeds a limited release's per-customer limit (drop days)."

  [[extensions.targeting]]
  target = "cart.validations.generate.run"
  input_query = "src/cart_validations_generate_run.graphql"
  export = "cart-validations-generate-run"

  [extensions.build]
  command = ""
  path = "dist/function.wasm"
