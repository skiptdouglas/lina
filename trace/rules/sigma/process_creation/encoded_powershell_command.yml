title: Encoded PowerShell Command Line
id: b41d9e07-5a3c-4d69-9d0e-7c1a5f3b2e88
status: experimental
description: PowerShell invoked with an encoded command and a hidden window.
references:
  - https://attack.mitre.org/techniques/T1027/
author: TRACE
date: 2026/08/23
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_flags:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '
      - ' -e '
  selection_hidden:
    CommandLine|contains:
      - ' -w hidden'
      - ' -WindowStyle Hidden'
  condition: selection_image and selection_flags and selection_hidden
falsepositives:
  - Some management tooling encodes its commands
level: high
tags:
  - attack.defense_evasion
  - attack.t1027
  - attack.execution
  - attack.t1059.001
