# TRACE — local/self-hosted stack.
#
#   make init && make up
#
# Secrets are declared as ${VAR:?...}: the stack refuses to start rather than
# booting with a default password (docs/SECURITY.md §2). `make init` writes a
# .env with randomly generated local credentials.
#
# TLS terminates at a reverse proxy in front of trace-ui in any real
# deployment; this file serves plain HTTP for local development only.

name: trace

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: trace-clickhouse
    environment:
      CLICKHOUSE_DB: ${TRACE_CLICKHOUSE_DATABASE:-trace}
      CLICKHOUSE_USER: ${TRACE_CLICKHOUSE_USER:-trace}
      CLICKHOUSE_PASSWORD: ${TRACE_CLICKHOUSE_PASSWORD:?set TRACE_CLICKHOUSE_PASSWORD in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    ports:
      - "${TRACE_CLICKHOUSE_HTTP_PORT:-8123}:8123"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: trace-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${TRACE_MINIO_ACCESS_KEY:?set TRACE_MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${TRACE_MINIO_SECRET_KEY:?set TRACE_MINIO_SECRET_KEY in .env}
    volumes:
      - minio-data:/data
    ports:
      - "${TRACE_MINIO_PORT:-9000}:9000"
      - "${TRACE_MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # One-shot: creates the evidence bucket and turns on versioning so an
  # overwritten object is recoverable (ADR-0005).
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: trace-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set trace http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing trace/$$TRACE_EVIDENCE_BUCKET &&
      mc version enable trace/$$TRACE_EVIDENCE_BUCKET &&
      echo 'evidence bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${TRACE_MINIO_ACCESS_KEY:?}
      MINIO_ROOT_PASSWORD: ${TRACE_MINIO_SECRET_KEY:?}
      TRACE_EVIDENCE_BUCKET: ${TRACE_EVIDENCE_BUCKET:-trace-evidence}
    restart: "no"

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: trace-opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms${TRACE_OPENSEARCH_HEAP:-1g} -Xmx${TRACE_OPENSEARCH_HEAP:-1g}"
      # Local development only. A real deployment enables the security plugin and TLS.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "${TRACE_OPENSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph-mage:1.22-memgraph-2.22
    container_name: trace-memgraph
    command: ["--log-level=WARNING", "--also-log-to-stderr"]
    volumes:
      - memgraph-data:/var/lib/memgraph
      - memgraph-log:/var/log/memgraph
    ports:
      - "${TRACE_MEMGRAPH_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host 127.0.0.1 --port 7687 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.5.4
    container_name: trace-ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${TRACE_OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  trace-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: trace-api
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      TRACE_ENV: ${TRACE_ENV:-dev}
      TRACE_LOG_LEVEL: ${TRACE_LOG_LEVEL:-INFO}
      TRACE_AUTH_MODE: ${TRACE_AUTH_MODE:-token}
      TRACE_API_TOKENS: ${TRACE_API_TOKENS:?set TRACE_API_TOKENS in .env}
      TRACE_CORS_ORIGINS: ${TRACE_CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      TRACE_DATABASE_URL: sqlite+aiosqlite:////srv/trace/data/trace.db
      TRACE_OBJECT_STORE: minio
      TRACE_MINIO_ENDPOINT: minio:9000
      TRACE_MINIO_ACCESS_KEY: ${TRACE_MINIO_ACCESS_KEY:?}
      TRACE_MINIO_SECRET_KEY: ${TRACE_MINIO_SECRET_KEY:?}
      TRACE_MINIO_SECURE: "false"
      TRACE_EVIDENCE_BUCKET: ${TRACE_EVIDENCE_BUCKET:-trace-evidence}
      TRACE_EVIDENCE_MAX_UPLOAD_BYTES: ${TRACE_EVIDENCE_MAX_UPLOAD_BYTES:-5368709120}
      TRACE_CLICKHOUSE_ENABLED: "true"
      TRACE_CLICKHOUSE_HOST: clickhouse
      TRACE_CLICKHOUSE_PORT: "8123"
      TRACE_CLICKHOUSE_USER: ${TRACE_CLICKHOUSE_USER:-trace}
      TRACE_CLICKHOUSE_PASSWORD: ${TRACE_CLICKHOUSE_PASSWORD:?}
      TRACE_CLICKHOUSE_DATABASE: ${TRACE_CLICKHOUSE_DATABASE:-trace}
      TRACE_OPENSEARCH_URL: http://opensearch:9200
      TRACE_MEMGRAPH_HOST: memgraph
      TRACE_MEMGRAPH_PORT: "7687"
      TRACE_OLLAMA_URL: http://ollama:11434
      TRACE_AUDIT_FAIL_CLOSED: "true"
    volumes:
      - api-data:/srv/trace/data
    ports:
      - "${TRACE_API_PORT:-8000}:8000"
    restart: unless-stopped

  trace-ui:
    build:
      context: ./frontend
    container_name: trace-ui
    depends_on:
      trace-api:
        condition: service_healthy
    ports:
      - "${TRACE_UI_PORT:-3000}:80"
    restart: unless-stopped

  # Optional: `docker compose --profile observability up -d`
  grafana:
    image: grafana/grafana:11.3.0
    container_name: trace-grafana
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${TRACE_GRAFANA_PASSWORD:-please-change-me}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "${TRACE_GRAFANA_PORT:-3001}:3000"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  clickhouse-data:
  clickhouse-logs:
  minio-data:
  opensearch-data:
  memgraph-data:
  memgraph-log:
  ollama-models:
  api-data:
  grafana-data:
