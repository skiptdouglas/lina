server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The UI holds only the analyst's TRACE token. It must never be able to reach
    # a model provider or a datastore directly (docs/SECURITY.md §7).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 6g;

    location /api/ {
        proxy_pass http://trace-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Evidence uploads and downloads are large and slow; do not buffer them.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location /health {
        proxy_pass http://trace-api:8000/health;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|svg|png)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
